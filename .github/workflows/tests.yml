name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
          products: >
            Simulink
            Optimization_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: run_tests
